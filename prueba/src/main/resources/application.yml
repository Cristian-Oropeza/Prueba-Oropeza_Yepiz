spring:
  application:
    name: onboarding-clientes
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

# ----------- GestoPago legacy: apagado por default -----------
gestopago:
  enabled: ${GESTOPAGO_ENABLED:false}
  auth:
    url: https://gestopago.portalventas.net
    id-distribuidor: 83
    codigo-dispositivo: GPS83-TPV-17
    password: "12345678"
    refresh-rate-ms: 3600000
  product:
    url: https://gestopago.portalventas.net
    token: ${GESTOPAGO_PRODUCT_TOKEN:}
    sync-cron: "0 0 6 * * *"
    sync-zone: America/Mexico_City

# Feign timeouts (solo se usan si gestopago.enabled=true)
spring.cloud:
  openfeign:
    client:
      config:
        gestoPagoProduct:
          connect-timeout: 5000
          read-timeout: 15000
  config:
    enabled: false
    import-check:
      enabled: false

# ----------- Onboarding: JWT (opcional por ahora) -----------
app:
  security:
    jwt:
      enabled: ${JWT_ENABLED:false}          # false = todos los endpoints abiertos
      secret: ${JWT_SECRET:password-completamente-segura-1-2-3-4-5-cambiar-en-prod-pls-okey-si-si-1234567890}
      expiration-ms: ${JWT_EXPIRATION_MS:3600000}
      issuer: onboarding-clientes
  cuenta:
    saldo-inicial: ${CUENTA_SALDO_INICIAL:0.00}
    prefijo-clabe: ${CUENTA_PREFIJO_CLABE:014180}

# ----------- OpenAPI -----------
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

server:
  port: ${PORT:8081}
  max-http-request-header-size: 16KB     # Buffer para URL + headers (default 8KB)
  tomcat:
    threads:
      max: 200
    accept-count: 200
    max-connections: 8192
    max-http-form-post-size: 2MB
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/plain
    min-response-size: 1024
  error:
    whitelabel:
      enabled: false
    include-message: always   # Expone message en /error para armar la GenericResponse

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: INFO
    com.proyecto.servicios: INFO
    org.hibernate.SQL: WARN
