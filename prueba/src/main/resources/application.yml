spring:
  application:
    name: onboarding-clientes
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  cloud:
    config:
      enabled: false
      import-check:
        enabled: false

# ----------- Onboarding: JWT (opcional) -----------
app:
  security:
    jwt:
      enabled: ${JWT_ENABLED:false}
      secret: ${JWT_SECRET:password-completamente-segura-1-2-3-4-5-cambiar-en-prod-pls-okey-si-si-1234567890}
      expiration-ms: ${JWT_EXPIRATION_MS:3600000}
      issuer: onboarding-clientes
  cuenta:
    saldo-inicial: ${CUENTA_SALDO_INICIAL:0.00}
    prefijo-clabe: ${CUENTA_PREFIJO_CLABE:014180}

# ----------- GestoPago (modulo de transacciones) ------------
# Para activar: GESTOPAGO_ENABLED=true + credenciales (ver .env.example).
# Las credenciales del distribuidor 83 son PUBLICAS de la documentacion de PuntoRed.
# Las llaves AES (SECRET_KEY e IV) se las entrega PuntoRed; sin ellas no se envia nada.
gestopago:
  enabled: ${GESTOPAGO_ENABLED:false}
  api-key: ${GESTOPAGO_API_KEY:}
  auth:
    url: ${GESTOPAGO_AUTH_URL:https://gestopago.portalventas.net}
    id-distribuidor: ${GESTOPAGO_ID_DISTRIBUIDOR:83}
    codigo-dispositivo: ${GESTOPAGO_CODIGO_DISPOSITIVO:GPS83-TPV-17}
    password: ${GESTOPAGO_AUTH_PASSWORD:}
    refresh-rate: ${GESTOPAGO_AUTH_REFRESH:1h}
    vigencia: ${GESTOPAGO_AUTH_VIGENCIA:23h}
  tx:
    url: ${GESTOPAGO_TX_URL:https://gestopago.portalventas.net}
    unidad: ${GESTOPAGO_TX_UNIDAD:083}
    zona-horaria: ${GESTOPAGO_TX_ZONA:America/Mexico_City}
    connect-timeout: ${GESTOPAGO_CONNECT_TIMEOUT:10s}
    read-timeout: ${GESTOPAGO_READ_TIMEOUT:70s}
    monto-maximo: ${GESTOPAGO_MONTO_MAXIMO:5000.00}
    tope-diario: ${GESTOPAGO_TOPE_DIARIO:20000.00}
    ventana-antiduplicado-seg: ${GESTOPAGO_VENTANA_ANTIDUP:30}
    confirmacion-intervalo: ${GESTOPAGO_CONF_INTERVALO:60s}
    min-segundos-antes-de-conciliar: ${GESTOPAGO_MIN_SEG_CONCILIAR:62}
    max-horas-conciliar: ${GESTOPAGO_MAX_HORAS_CONCILIAR:24}
    max-intentos: ${GESTOPAGO_MAX_INTENTOS:60}
    tamano-lote: ${GESTOPAGO_TAMANO_LOTE:20}
    conciliacion-enabled: ${GESTOPAGO_CONCILIACION_ENABLED:false}
  cifrado:
    llave: ${GESTOPAGO_CIFRADO_LLAVE:}
    iv: ${GESTOPAGO_CIFRADO_IV:}

# ----------- OpenAPI -----------
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  paths-to-exclude: /error

server:
  port: ${PORT:8081}
  max-http-request-header-size: 16KB
  tomcat:
    threads:
      max: 200
    accept-count: 200
    max-connections: 8192
    max-http-form-post-size: 2MB
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/plain
    min-response-size: 1024
  error:
    whitelabel:
      enabled: false
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: INFO
    com.proyecto.servicios: INFO
    org.hibernate.SQL: WARN
