# --- Configuracion del DataSource personalizado ---
spring.datasource.driver.class=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/prueba_gestopago
spring.datasource.username=postgres
spring.datasource.password=123456
spring.jpa.hibernate.ddl-auto=none

# Flyway (gestionado manualmente via FlywayConfig)
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration
spring.flyway.table=flyway_schema_history
spring.flyway.schemas=public

# GestoPago
gestopago.auth.url=https://gestopago.portalventas.net
gestopago.auth.id-distribuidor=83
gestopago.auth.codigo-dispositivo=GPS83-TPV-17
gestopago.auth.password=12345678
# Intervalo de renovacion del token en ms (3600000 = 1 hora)
gestopago.auth.refresh-rate-ms=3600000

# GestoPago - Catalogo de productos
gestopago.product.url=https://gestopago.portalventas.net
gestopago.product.token=${GESTOPAGO_PRODUCT_TOKEN:}
spring.cloud.openfeign.client.config.gestoPagoProduct.connect-timeout=5000
spring.cloud.openfeign.client.config.gestoPagoProduct.read-timeout=15000
# Sincronizacion diaria del catalogo (segundo minuto hora dia mes dia-semana)
gestopago.product.sync-cron=0 0 6 * * *
gestopago.product.sync-zone=America/Mexico_City

# MongoDB (catalogo de productos GestoPago)
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/gestopago}

spring.cloud.config.enabled=false
spring.cloud.config.import-check.enabled=false

# Logging
logging.level.root=INFO
logging.level.com.proyecto.servicios=DEBUG

# Informacion general del API
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
server.port=8081
# URL base del servidor (localhost)
openapi.url.dev=http://localhost:8081
openapi.description.dev=Local Development Server
