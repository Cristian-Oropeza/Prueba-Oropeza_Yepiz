spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/onboarding
    username: onboarding
    password: onboarding
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
      connection-timeout: 3000
      leak-detection-threshold: 20000
      pool-name: OnboardingHikariCP
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc.batch_size: 25
        order_inserts: true
        order_updates: true
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

logging:
  level:
    com.proyecto.servicios.onboarding: DEBUG
